name: crawl-k4hd

on:
  schedule:
    - cron: "0 11 * * *"   # 每天 UTC 11:00 = 北京 19:00（避开 eh 的 UTC 12:00 时段）
  workflow_dispatch:
    inputs:
      limit:
        description: "本次处理上限（留空=全部）"
        required: false
        default: ""
      dry_run:
        description: "1=只分析不发送"
        required: false
        default: ""

concurrency:
  group: crawl-k4hd
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  k4hd:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run 4khd source
        env:
          PYTHONUNBUFFERED: "1"
          TG_TOKEN_4KHD: ${{ secrets.TG_TOKEN_4KHD }}
          TG_CHAT_ID_4KHD: ${{ secrets.TG_CHAT_ID_4KHD }}
          TG_GROUP_ID: ${{ secrets.TG_GROUP_ID }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_BASE_URL: ${{ secrets.AI_BASE_URL }}
          AI_MODEL: ${{ secrets.AI_MODEL }}
          TELEGRAPH_TOKEN: ${{ secrets.TELEGRAPH_TOKEN }}
        run: |
          ARGS="4khd"
          [ -n "${{ github.event.inputs.limit }}" ] && ARGS="$ARGS --limit ${{ github.event.inputs.limit }}"
          [ "${{ github.event.inputs.dry_run }}" = "1" ] && ARGS="$ARGS --dry-run"
          python run.py $ARGS

      - name: Commit state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state/
          if git diff --staged --quiet; then
            echo "No changes"
          else
            git commit -m "chore: update 4khd state [skip ci]"
            git pull --rebase --autostash
            git push
          fi
